name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The site publishes an accessibility statement, so contrast is a stated
      # commitment. The brand gold (#c0a91e) is 2.35:1 on white and was being
      # used on the required-field asterisks.
      - name: Assert WCAG AA contrast
        run: python3 tools/check-contrast.py

      # Guards for the three regressions this rebuild exists to prevent. If any
      # of these fire, the site has drifted back toward the live Wix behaviour.
      - name: Assert SEO invariants in built output
        run: |
          npx next start -p 3111 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:3111/ && break; sleep 1; done

          fail=0
          for path in "/" "/turtle-haven" "/book/turtle-haven" "/faqs" "/properties" "/guides"; do
            html=$(curl -sS "http://127.0.0.1:3111$path")

            h1=$(printf '%s' "$html" | grep -o '<h1' | wc -l | tr -d ' ')
            if [ "$h1" != "1" ]; then
              echo "::error::$path has $h1 <h1> elements, expected exactly 1"
              fail=1
            fi

            if ! printf '%s' "$html" | grep -q 'application/ld+json'; then
              echo "::error::$path has no JSON-LD"
              fail=1
            fi

            if printf '%s' "$html" | grep -q '5087260695'; then
              echo "::error::$path contains the retired 508 phone number"
              fail=1
            fi

            # Titles must survive in a SERP. Seven live Wix titles exceeded 60
            # and truncated mid-phrase; the type carried a "<=60" comment but
            # nothing enforced it, and the property titles were lengthened on
            # 2026-07-26 to add a place qualifier. Enforce it on built output.
            title=$(printf '%s' "$html" | grep -o '<title[^>]*>[^<]*</title>' \
                    | head -1 | sed -E 's/<title[^>]*>(.*)<\/title>/\1/')
            len=${#title}
            if [ "$len" -gt 60 ]; then
              echo "::error::$path <title> is $len chars (>60), truncates in search: $title"
              fail=1
            fi
            if [ "$len" -lt 15 ]; then
              echo "::error::$path <title> is only $len chars — empty or a template miss: $title"
              fail=1
            fi
          done

          # Search Console baseline (docs/BASELINE-2026-07-26.md): the entire
          # named-impression tail is generic "sea haven" / "beach haven"
          # collisions with unrelated businesses — including 158 impressions for
          # "sea haven st augustine rental", 150 miles away — at average
          # position 33.7. Every property title must name its own town.
          for pair in "/turtle-haven:Melbourne Beach" "/shell-haven:Melbourne Beach" \
                      "/beach-haven:Indialantic" "/sea-haven:Indialantic" \
                      "/the-dunes:Melbourne Beach" "/beach-street:Indialantic"; do
            p=${pair%%:*}; town=${pair#*:}
            t=$(curl -sS "http://127.0.0.1:3111$p" \
                | grep -o '<title[^>]*>[^<]*</title>' | head -1)
            case "$t" in
              *"$town"*) ;;
              *) echo "::error::$p <title> does not name $town — a generic house name cannot rank: $t"
                 fail=1 ;;
            esac
          done

          # Booking routes must ship NO iframe at all. Strengthened 2026-07-27
          # when the embed was replaced by a deep link to Guesty (Option A): the
          # live equivalent transferred 12,906 KiB at a 27.4 s mobile LCP for a
          # surface no crawler could read. The gate used to allow a click-mounted
          # iframe; there is no longer any reason for one to exist here.
          for bp in /book/turtle-haven /book/the-dunes /book/the-florida-havens; do
            if curl -sS "http://127.0.0.1:3111$bp" | grep -q '<iframe'; then
              echo "::error::$bp ships an iframe; booking must deep-link to Guesty, not embed it"
              fail=1
            fi
          done

          # The booking CTA must be in the server HTML — the whole point of
          # dropping the embed. Either the real date form or the enquiry
          # fallback, never an empty container.
          #
          # Matched on attributes, not visible text: React splits adjacent text
          # nodes in SSR output, so "Call 321-209-0495" arrives as two separate
          # nodes and a literal grep for it fails on a page that is correct.
          #
          # All six properties have a verified Guesty listing, so each must ship a
          # real deep-link form. The brand route has no combined listing in the
          # account — confirmed, there is no "all four houses" listing — so it must
          # ship the enquiry fallback instead. Asserting the specific one each page
          # should have, rather than "either", is what catches a listing ID going
          # missing and silently degrading a bookable house to a phone number.
          for bp in turtle-haven shell-haven beach-haven sea-haven the-dunes beach-street; do
            cta=$(curl -sS "http://127.0.0.1:3111/book/$bp")
            if ! printf '%s' "$cta" | grep -q 'action="https://[a-z]*\.guestybookings\.com/en/properties/[0-9a-f]\{24\}"'; then
              echo "::error::/book/$bp has no Guesty deep-link form; a bookable house must not fall back to enquiry"
              fail=1
            fi
          done

          brand=$(curl -sS http://127.0.0.1:3111/book/the-florida-havens)
          if ! printf '%s' "$brand" | grep -q 'href="tel:+13212090495"'; then
            echo "::error::/book/the-florida-havens must show the enquiry fallback — no combined Guesty listing exists"
            fail=1
          fi
          if printf '%s' "$brand" | grep -q 'guestybookings\.com'; then
            echo "::error::/book/the-florida-havens links to a single listing; that would book one house, not the group"
            fail=1
          fi

          # Rocket-launch demand content must not be redirected to the guest
          # portal. Regression guard for the /beach-street-shuttle-launches bug.
          shuttle=$(curl -sS -o /dev/null -w '%{redirect_url}' http://127.0.0.1:3111/beach-street-shuttle-launches)
          case "$shuttle" in
            */guides/space-coast-rocket-launches) ;;
            *) echo "::error::/beach-street-shuttle-launches redirects to '$shuttle', expected the rocket guide"; fail=1 ;;
          esac

          exit $fail

      # The rebuild must never link to a URL the matrix retires. Grok's live
      # link-rot pass found the Wix site full of such links; the rebuild starts
      # clean and should stay that way, since an internal link into a 301 is a
      # self-inflicted redirect hop on every click.
      - name: Assert no internal links into retired URLs
        run: |
          npx next start -p 3113 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:3113/ && break; sleep 1; done

          retired=$(grep -oE "\{ from: '[^']*', to: [^,]*, action: '301'" content/url-matrix.ts \
                    | sed -E "s/\{ from: '([^']*)'.*/\1/" | sort -u)
          pages=$(curl -sS http://127.0.0.1:3113/sitemap.xml \
                  | grep -oE '<loc>[^<]+' | sed 's|<loc>||' \
                  | sed -E 's|https?://[^/]+||' | sed 's|^$|/|')

          fail=0
          for page in $pages; do
            html=$(curl -sS "http://127.0.0.1:3113$page")
            for r in $retired; do
              if printf '%s' "$html" | grep -q "href=\"$r\""; then
                echo "::error::$page links to $r, which the matrix retires (301)"
                fail=1
              fi
            done
          done
          [ $fail -eq 0 ] && echo "no internal links into retired URLs"
          exit $fail

      # Every URL the matrix marks KEEP must actually serve a page. The matrix
      # said /guest-blog, /post/* and /guest-story-entry-form were 1:1 keeps
      # while the app had no route for any of them -- all three would have 404'd
      # at cutover and dropped an indexed page. A declared intention is not a
      # route; assert it.
      - name: Assert every KEEP URL in the matrix resolves
        run: |
          npx next start -p 3112 &
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:3112/ && break; sleep 1; done

          keeps=$(grep -oE "\{ from: '[^']*', to: [^,]*, action: 'KEEP(\+NOINDEX)?'" content/url-matrix.ts \
                  | sed -E "s/\{ from: '([^']*)'.*/\1/")
          fail=0
          for u in $keeps; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:3112$u")
            if [ "$code" != "200" ]; then
              echo "::error::matrix marks $u as KEEP but it returned HTTP $code"
              fail=1
            else
              echo "ok $u"
            fi
          done
          exit $fail

      # Every redirect target must actually resolve. A permanent redirect to a
      # host with no DNS is worse than no redirect at all -- this caught 42 rows
      # pointing at welcome.mediahaven.app, which does not exist.
      - name: Assert every redirect target resolves
        run: |
          fail=0
          targets=$(node -e "
            const m = require('./.next/required-server-files.json');
            const rs = (m.config.redirects || []);
            console.log(rs.map(r => r.destination).filter(d => /^https?:\/\//.test(d)).join('\n'));
          " 2>/dev/null || true)

          if [ -z "$targets" ]; then
            echo 'No external redirect targets — all redirects are relative. OK.'
            exit 0
          fi

          for t in $(printf '%s\n' "$targets" | sort -u); do
            code=$(curl -sS -o /dev/null -L --max-time 20 -w '%{http_code}' "$t" || echo 000)
            if [ "$code" = "000" ] || [ "$code" -ge 400 ]; then
              echo "::error::redirect target $t is unreachable (HTTP $code)"
              fail=1
            else
              echo "ok $t ($code)"
            fi
          done
          exit $fail
